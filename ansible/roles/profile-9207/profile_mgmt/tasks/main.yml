- name: Create group {{ custom_group }}
  group:
    name: "{{ custom_group }}"
    state: present

- name: Create user {{ custom_user }}
  user:
    name: "{{ custom_user }}"
    group: "{{ custom_group }}"
    home: "{{ user_home }}"
    shell: "{{ user_shell }}"
    state: present
    create_home: yes

