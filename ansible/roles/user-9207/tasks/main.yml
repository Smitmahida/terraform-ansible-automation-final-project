- name: Create cloudadmins group
  group:
    name: cloudadmins
    state: present

- name: Create user accounts
  user:
    name: "{{ item }}"
    groups: "cloudadmins,sudo"
    shell: /bin/bash
    create_home: yes
    state: present
  loop:
    - user100
    - user200
    - user300

- name: Ensure .ssh directory exists for each user
  file:
    path: "/home/{{ item }}/.ssh"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0700'
  loop:
    - user100
    - user200
    - user300

- name: Generate SSH key pair for each user
  user:
    name: "{{ item }}"
    generate_ssh_key: yes
    ssh_key_bits: 2048
    ssh_key_file: .ssh/id_rsa
  loop:
    - user100
    - user200
    - user300

